name: Browser intro regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'world.js'
      - 'world-assets.js'
      - 'divisions.js'
      - 'styles.css'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-intro.yml'
  workflow_dispatch:
concurrency:
  group: maddie-3d-browser-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  chromium-intro:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve static prototype
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/maddie-server.log 2>&1 &
          sleep 2
      - name: Check intro, Start, fail-safe and deep links
        run: node tests/browser-smoke.mjs
      - name: Capture browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maddie-intro-browser-screenshots
          path: browser-results/
          retention-days: 3
